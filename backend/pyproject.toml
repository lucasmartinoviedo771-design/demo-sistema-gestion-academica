[project]
name = "ipes6-backend"
version = "0.1.0"
description = "Backend for IPES6 Pre-registration System"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "Django==5.2.17",
    "redis==5.2.1",
    "django-redis==5.4.0",
    "django-ninja==1.4.3",
    "django-cors-headers==4.8.0",
    "PyJWT==2.13.0",
    "gunicorn==22.0.0",
    "pymysql", # Recommended for Windows
    "reportlab==4.4.3",
    "qrcode[pil]",
    "Pillow==12.3.0",
    "requests==2.33.0",
    "email-validator==2.3.0",
    "lxml==6.1.0",
    "weasyprint==68.0",
    "pydyf==0.11.0",
    "pyhanko==0.31.0",
    "pyhanko-certvalidator==0.29.0",
    "pypdf==6.16.1",
    "python-magic==0.4.27",
    "pyphen==0.17.2",
    "python-bidi==0.6.6",
    "arabic-reshaper==3.0.0",
    "fonttools==4.60.2",
    "dnspython==2.8.0",
    "cffi==2.0.0",
    "cryptography==50.0.0",
    "oscrypto==1.3.0",
    "asn1crypto==1.5.1",
    "charset-normalizer==3.4.3",
    "idna==3.15",
    "urllib3==2.7.0",
    "certifi==2025.8.3",
    "Brotli==1.2.0",
    "six==1.17.0",
    "typing-inspection==0.4.1",
    "typing_extensions==4.15.0",
    "tzdata==2025.2",
    "tzlocal==5.3.1",
    "uritools==5.0.0",
    "webencodings==0.5.1",
    "tinyhtml5==2.0.0",
    "tinycss2==1.5.0",
    "svglib==1.5.1",
    "zopfli==0.2.3.post1",
    "html5lib==1.1",
    "pydantic==2.11.9",
    "pydantic_core==2.33.2",
    "annotated-types==0.7.0",
    "asgiref==3.9.1",
    "sqlparse==0.6.0",
    "python-dotenv==1.2.2",
    "pytest==9.0.3",
    "pytest-django==4.9.0",
    "django-silk==5.3.0",
    "openpyxl==3.1.5",
    "ruff>=0.8.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["apps", "core"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.uv]
package = false   # ðŸ‘‰ clave: no intentes construir wheel del proyecto local
# (opcional) configs de uv; NO pongas 'python =' acÃ¡
# ejemplo:
# python-preference = "only-managed"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core"]

[tool.ruff]
line-length = 120
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
    ".vulture_whitelist.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
ignore = [
    "D",      # docstrings
    "E501",   # line too long — accepted in this codebase
    "E402",   # module-level import not at top — required by Django app-loading order
    "B904",   # raise without `from` — codebase convention
    "B008",   # function call in default argument — Django Ninja Body() pattern
    "SIM102", # nested if — readability preference
    "F401",   # unused import — codebase usa re-exports en api.py e __init__.py
    "E722",   # bare except — usado intencionalmente
    "B018",   # useless expression — algunos son intencionales
    "F841",   # unused variable — algunos son intencionales
    "SIM105", # use contextlib.suppress — preferencia de estilo
    "SIM103", # return condition directly — preferencia de estilo
    "SIM108", # use ternary operator — preferencia de legibilidad
    "C414",   # unnecessary list() in sorted() — patrón existente
    "UP042",  # class inherits str and Enum — patrón existente
    "UP035",  # typing.List/Dict deprecated — se migra gradualmente
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["core", "apps"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apps.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "apps.estudiantes.api.regularidades_carga",
    "apps.estudiantes.api.actas"
]
ignore_errors = false

[tool.django-stubs]
django_settings_module = "config.settings"
